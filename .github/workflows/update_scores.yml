name: Update quant scores

on:
  schedule:
    # 매일 21:30 UTC = 한국시간 06:30 (장 시작 전, 전일 종가 기준 데이터로 갱신)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Health check (KIS/DART/KIND/Supabase)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: uv run pipeline/health_check.py

      - name: Run pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: uv run pipeline/run_pipeline.py

      - name: Commit updated data
        # 파이프라인 자체가 1~3시간 걸려서(KIS/DART 833종목 순회), 그 사이 다른 워크플로우
        # (미국판 갱신, 수동 push 등)가 먼저 push해버리면 아래 단순 `git push`가
        # non-fast-forward로 거부됨(2026-08-28 실제 발생, "! [rejected] main -> main
        # (fetch first)") — pull --rebase 후 push를 몇 번 재시도해서 경합을 흡수.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores_quant.csv data/score_history.csv
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: 일일 점수 데이터 갱신"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push 실패 (${i}/5) — 10초 후 재시도"
            sleep 10
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1
