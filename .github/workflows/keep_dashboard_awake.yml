name: Keep dashboard awake

on:
  schedule:
    # 원래 하루 1번(22:00 UTC)이었는데, 실제로는 핑 자체는 매번 성공했음에도
    # 두 앱 다 다시 잠드는 걸 확인함(2026-08-28) — 원인은 핑 로직이 아니라
    # GitHub Actions의 `schedule` 트리거 자체가 부정확해서였음: 실행 이력을 보니
    # 매번 몇 시간씩 밀리다가(22:24→22:25→02:56→05:57 UTC) 실질 간격이 하루를
    # 넘기는 경우가 생겼고, 그 사이에 Streamlit Cloud 슬립 타임아웃을 넘긴 것으로
    # 추정. GitHub 공식 문서도 "schedule 이벤트는 액션 부하가 높으면 지연될 수
    # 있다"고 명시함 — 그래서 하루 1번 대신 3시간마다로 촘촘히 돌려서, 지연이
    # 생겨도 실질 간격이 하루를 넘기지 않게 여유를 둠. 정각(0분)은 몰리는 시간대라
    # 피함. 퍼블릭 레포라 Actions 분당 비용은 여전히 무료.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Ping dashboard (KOSPI)
        env:
          STREAMLIT_APP_URL: "https://kospi-dividend-screener-xxvxn92xl2funlzgw9f3ec.streamlit.app/"
        run: uv run pipeline/ping_dashboard.py

      - name: Ping dashboard (US)
        env:
          STREAMLIT_APP_URL: "https://kospi-dividend-screener-us.streamlit.app/"
        run: uv run pipeline/ping_dashboard.py
